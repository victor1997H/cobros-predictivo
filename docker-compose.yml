services:
  postgres:
    image: postgres:17-alpine
    container_name: cobros_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - cobros_network


  backend:
    image: ghcr.io/victor1997h/cobros-predictivo-backend:${BACKEND_IMAGE_TAG:-latest}
    pull_policy: always

    container_name: cobros_backend
    restart: unless-stopped

    environment:
      PORT: 3000
      BUILD_SHA: ${BUILD_SHA:-local}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:-https://sistemacobros.byronrm.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-v26.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-es}
      WHATSAPP_TEMPLATE_USE_PARAMETERS: ${WHATSAPP_TEMPLATE_USE_PARAMETERS:-false}
      WHATSAPP_TEMPLATE_BODY_PARAMETER_COUNT: ${WHATSAPP_TEMPLATE_BODY_PARAMETER_COUNT:-0}
      WHATSAPP_SEND_FREE_TEXT: ${WHATSAPP_SEND_FREE_TEXT:-false}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - cobros_network
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.cobros-backend.rule=Host(`backsistemacobros.byronrm.com`)"
      - "traefik.http.routers.cobros-backend.entrypoints=websecure"
      - "traefik.http.routers.cobros-backend.tls.certresolver=letsencrypt"

      - "traefik.http.services.cobros-backend.loadbalancer.server.port=3000"


  frontend:
    image: ghcr.io/victor1997h/cobros-predictivo-frontend:latest
    pull_policy: always

    container_name: cobros_frontend
    restart: unless-stopped

    depends_on:
      - backend

    networks:
      - cobros_network
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.cobros-frontend.rule=Host(`sistemacobros.byronrm.com`)"
      - "traefik.http.routers.cobros-frontend.entrypoints=websecure"
      - "traefik.http.routers.cobros-frontend.tls.certresolver=letsencrypt"

      - "traefik.http.services.cobros-frontend.loadbalancer.server.port=80"


  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cobros_pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - cobros_network
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.cobros-pgadmin.rule=Host(`pgsistemacobros.byronrm.com`)"
      - "traefik.http.routers.cobros-pgadmin.entrypoints=websecure"
      - "traefik.http.routers.cobros-pgadmin.tls.certresolver=letsencrypt"

      - "traefik.http.services.cobros-pgadmin.loadbalancer.server.port=80"


  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: cobros_n8n
    restart: unless-stopped

    ports:
      - "127.0.0.1:5678:5678"

    depends_on:
      - backend

    environment:
      N8N_HOST: ${N8N_HOST:-n8nsistemacobros.byronrm.com}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-https://n8nsistemacobros.byronrm.com}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-https://n8nsistemacobros.byronrm.com}
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-1}
      GENERIC_TIMEZONE: America/Guayaquil
      TZ: America/Guayaquil
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows

    networks:
      - cobros_network
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.cobros-n8n.rule=Host(`n8nsistemacobros.byronrm.com`)"
      - "traefik.http.routers.cobros-n8n.entrypoints=websecure"
      - "traefik.http.routers.cobros-n8n.tls.certresolver=letsencrypt"

      - "traefik.http.services.cobros-n8n.loadbalancer.server.port=5678"


volumes:
  postgres_data:
  pgadmin_data:
  n8n_data:


networks:
  cobros_network:
    driver: bridge

  proxy:
    external: true
