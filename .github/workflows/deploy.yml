name: Frontend CI/CD Cobros Predictivo

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  packages: write

env:
  FRONTEND_IMAGE: ghcr.io/victor1997h/cobros-predictivo-frontend

jobs:
  build-publish-deploy-frontend:
    name: Construir, publicar y desplegar frontend
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Construir y publicar frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Probar conexion SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            echo "VPS conectado correctamente"
            hostname
            whoami
            docker --version
            docker compose version

      - name: Desplegar frontend en VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail

            cd /opt/docker/apps/cobros-predictivo

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USER" \
              --password-stdin

            docker compose pull frontend
            docker compose up -d --no-deps frontend

            docker image prune -f

            docker compose ps frontend
